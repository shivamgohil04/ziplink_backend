[package]
name = "ziplink-backend"
version = "0.1.0"
edition = "2024"

[dependencies]

#Web framework
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace", "request-id"] }


#Async runtime 
tokio = { version = "1.52.1", features = ["full"] }

#serialization 
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

#Database - PostgreSQL
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "migrate"] }


redis = { version = "1.2.0", features = ["tokio-comp", "connection-manager"] }


rdkafka = { version = "0.39.0", features = ["cmake-build"] }

jsonwebtoken = "10.3.0"

#Time
chrono = { version = "0.4.44", features = ["serde"] }

dotenvy = "0.15.7"

config = "0.15.22"

uuid = { version = "1.23.1", features = ["v4", "serde"] }

#Tracing / Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

#Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

#HTTP client (for Geo IP)
reqwest = { version = "0.13.3", features = ["json"] }

#Rate limiting
governor = "0.10.4"

#password hashing
argon2 = "0.5.3"

